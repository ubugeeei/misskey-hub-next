name: SSG raster reproducibility control
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  control:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vrt-sites
          run-id: 41274366899
          github-token: ${{ github.token }}
      - name: Repeat unchanged reference control and optimized comparison
        env:
          CONTROL_VIEWPORT: ${{ matrix.viewport }}
          CONTROL_THEME: ${{ matrix.theme }}
        run: node tests/vrt/raster-control.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raster-${{ matrix.viewport }}-${{ matrix.theme }}
          path: output/playwright/
          retention-days: 7
