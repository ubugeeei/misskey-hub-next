name: SSG screenshot compositor frame control probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node .vrt-control/beginframe-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beginframe-contract
          path: output/playwright/
          retention-days: 7
