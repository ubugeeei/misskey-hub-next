name: SSG glyph and canvas capture contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: original
            image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
          - sdk: upgraded
            image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      VRT_CONTROLLED_FRAMES: "1"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: pnpm
      - name: Match the upgraded SDK to its pinned image
        if: matrix.sdk == 'upgraded'
        run: |
          git fetch --depth=1 origin 172772b5e25e8d1e56e269f500a35cde64449ff7
          git show FETCH_HEAD:package.json > package.json
          git show FETCH_HEAD:pnpm-lock.yaml > pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify every repeated code/copyright cell and 2D/WebGL canvas
        run: node .vrt-control/glyph-contract.mjs
