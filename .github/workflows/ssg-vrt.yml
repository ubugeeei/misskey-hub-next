name: SSG Chromium 145 controlled frame qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        theme: [light, dark]
    env:
      CONTROL_VIEWPORT: ${{ matrix.viewport }}
      CONTROL_THEME: ${{ matrix.theme }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      VRT_CONTROLLED_FRAMES: "1"
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vrt-sites
          run-id: 41296551808
          github-token: ${{ github.token }}
      - name: Verify the exact production capture contract
        run: node tests/vrt/frame-contract.mjs
      - name: Qualify original browser with controlled compositor frames
        run: node .vrt-control/legacy-frames.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium145-${{ matrix.viewport }}-${{ matrix.theme }}
          path: output/playwright/
          retention-days: 7
