name: SSG code paint control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      VRT_CONTROLLED_FRAMES: "1"
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vrt-sites
          run-id: 41296551808
          github-token: ${{ github.token }}
      - name: Reproduce both code-page differences with DOM and computed style evidence
        run: node .vrt-control/code-control.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-paint-traces
          path: output/playwright/
          retention-days: 7
